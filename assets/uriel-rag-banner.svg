<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>
    
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.18)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.16)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)" />
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Flow Gradient Lines -->
    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="240" cy="200" r="380" fill="url(#glow-cyan)" />
  <circle cx="960" cy="440" r="420" fill="url(#glow-purple)" />

  <!-- Outer Tech Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
  
  <!-- Top Telemetry Ribbon -->
  <g transform="translate(48, 48)">
    <!-- Security Shield Badge -->
    <rect x="0" y="0" width="220" height="34" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="18" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">🔒 AIR-GAPPED VERIFIED</text>

    <!-- Latency Badge -->
    <rect x="232" y="0" width="170" height="34" rx="8" fill="rgba(168, 85, 247, 0.1)" stroke="#c084fc" stroke-width="1.2" />
    <text x="248" y="22" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">⚡ SUB-120ms RETRIEVAL</text>

    <!-- Cloud Egress Indicator -->
    <rect x="414" y="0" width="180" height="34" rx="8" fill="rgba(34, 197, 94, 0.1)" stroke="#22c55e" stroke-width="1.2" />
    <text x="430" y="22" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">🛡️ 0 BYTES EGRESS</text>

    <text x="1104" y="22" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">URIEL // RAG ARCHITECTURE</text>
  </g>

  <!-- Main Title & Tagline -->
  <g transform="translate(48, 130)">
    <text x="0" y="36" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Zero-Leakage Local RAG Architecture
    </text>
    <text x="0" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="400">
      Deterministic Document Ingestion, 384-D Vector Indexing & Local Context Grounding
    </text>
  </g>

  <!-- Architectural Pipeline Canvas -->
  <g transform="translate(60, 240)">
    
    <!-- Connecting Bus Line -->
    <line x1="80" y1="90" x2="1000" y2="90" stroke="url(#flow-line)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />

    <!-- 1. Node: Local Ingestion -->
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="170" height="120" rx="14" fill="#0d1424" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#node-glow)" />
      <rect x="14" y="14" width="34" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" />
      <text x="31" y="37" fill="#38bdf8" font-family="sans-serif" font-size="18" text-anchor="middle">📄</text>
      <text x="58" y="35" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Raw Corpus</text>
      <text x="14" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">PDFs & Financials</text>
      <text x="14" y="90" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Local Disk Read</text>
      <text x="14" y="110" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Air-Gapped Ingest</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <polygon points="215,90 205,84 205,96" fill="#38bdf8" />

    <!-- 2. Node: Sliding Chunking -->
    <g transform="translate(235, 30)">
      <rect x="0" y="0" width="180" height="120" rx="14" fill="#0d1424" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
      <rect x="14" y="14" width="34" height="34" rx="8" fill="rgba(129, 140, 248, 0.15)" />
      <text x="31" y="37" fill="#818cf8" font-family="sans-serif" font-size="18" text-anchor="middle">✂️</text>
      <text x="58" y="35" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Sliding Window</text>
      <text x="14" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Chunk: 512 Tokens</text>
      <text x="14" y="90" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Overlap: 64 Tokens</text>
      <text x="14" y="110" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10">Context Bridging</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <polygon points="440,90 430,84 430,96" fill="#818cf8" />

    <!-- 3. Node: Vector Store -->
    <g transform="translate(460, 30)">
      <rect x="0" y="0" width="180" height="120" rx="14" fill="#0d1424" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5" filter="url(#node-glow)" />
      <rect x="14" y="14" width="34" height="34" rx="8" fill="rgba(168, 85, 247, 0.15)" />
      <text x="31" y="37" fill="#c084fc" font-family="sans-serif" font-size="18" text-anchor="middle">🧬</text>
      <text x="58" y="35" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Vector Index</text>
      <text x="14" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">ChromaDB Local</text>
      <text x="14" y="90" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">384-D BGE Embeds</text>
      <text x="14" y="110" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">Zero Cloud Egress</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <polygon points="665,90 655,84 655,96" fill="#c084fc" />

    <!-- 4. Node: Cosine Filter -->
    <g transform="translate(685, 30)">
      <rect x="0" y="0" width="180" height="120" rx="14" fill="#0d1424" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
      <rect x="14" y="14" width="34" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" />
      <text x="31" y="37" fill="#38bdf8" font-family="sans-serif" font-size="18" text-anchor="middle">🎯</text>
      <text x="58" y="35" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Cosine Gate</text>
      <text x="14" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">cos_sim &gt;= 0.78</text>
      <text x="14" y="90" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Anti-Hallucination</text>
      <text x="14" y="110" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Top-3 Ranked</text>
    </g>

    <!-- Arrow 4 to 5 -->
    <polygon points="890,90 880,84 880,96" fill="#38bdf8" />

    <!-- 5. Node: Local LLM Output -->
    <g transform="translate(910, 30)">
      <rect x="0" y="0" width="170" height="120" rx="14" fill="#0d1424" stroke="rgba(34, 197, 94, 0.5)" stroke-width="1.5" />
      <rect x="14" y="14" width="34" height="34" rx="8" fill="rgba(34, 197, 94, 0.15)" />
      <text x="31" y="37" fill="#4ade80" font-family="sans-serif" font-size="18" text-anchor="middle">🤖</text>
      <text x="58" y="35" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Grounded LLM</text>
      <text x="14" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Ollama / Llama-3</text>
      <text x="14" y="90" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Local IPC Socket</text>
      <text x="14" y="110" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">100% Air-Gapped</text>
    </g>
  </g>

  <!-- Technical Telemetry Footer Card -->
  <g transform="translate(48, 460)">
    <rect x="0" y="0" width="1104" height="100" rx="12" fill="rgba(13, 20, 36, 0.7)" stroke="rgba(255, 255, 255, 0.08)" />
    
    <g transform="translate(30, 26)">
      <text x="0" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">EMBEDDING MODEL</text>
      <text x="0" y="42" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">BAAI/bge-small-en-v1.5</text>
      <text x="0" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">384 Dimensions (Dense)</text>
    </g>

    <line x1="280" y1="20" x2="280" y2="80" stroke="rgba(255, 255, 255, 0.1)" />

    <g transform="translate(320, 26)">
      <text x="0" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">CHUNKING STRATEGY</text>
      <text x="0" y="42" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">Recursive Sliding Window</text>
      <text x="0" y="60" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">512 Token Window • 64 Overlap</text>
    </g>

    <line x1="590" y1="20" x2="590" y2="80" stroke="rgba(255, 255, 255, 0.1)" />

    <g transform="translate(630, 26)">
      <text x="0" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">RE-RANKING ENGINE</text>
      <text x="0" y="42" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">NumPy Dot-Product Cosine</text>
      <text x="0" y="60" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">Threshold Gated (cos_sim &gt;= 0.78)</text>
    </g>

    <line x1="900" y1="20" x2="900" y2="80" stroke="rgba(255, 255, 255, 0.1)" />

    <g transform="translate(930, 26)">
      <text x="0" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">SECURITY AUDIT</text>
      <text x="0" y="42" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">100% Air-Gapped</text>
      <text x="0" y="60" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">Verified 0 Remote Bytes</text>
    </g>
  </g>
</svg>
